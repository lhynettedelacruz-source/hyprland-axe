# Hypridle configuration optimized for gaming laptops
# (Lenovo LOQ, Legion, and similar gaming hardware)
#
# This configuration uses longer timeouts to avoid interrupting
# downloads, game updates, and background tasks common on gaming systems.
#
# To use this config, copy it to ~/.config/hypr/hypridle.conf
# or source it from your main hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Dim screen after 5 minutes (longer than default for gaming)
listener {
    timeout = 300                                # 5 min
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# Lock screen after 10 minutes
listener {
    timeout = 600                                 # 10 min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# Screen off after 15 minutes
listener {
    timeout = 900                                 # 15 min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

# Suspend after 60 minutes (longer for gaming laptops to allow downloads/updates)
# Comment out or remove this section if you don't want auto-suspend
listener {
    timeout = 3600                                # 60 min
    on-timeout = systemctl suspend                # suspend pc
}
